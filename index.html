<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Read Aloud">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon180.png">
<title>Read Aloud</title>
<style>
:root{
  --bg:#fbfbfa; --fg:#1d1d1f; --muted:#8a8a8e; --line:#e6e6e3; --panel:#ffffff;
  --seg:#f0eee7; --seg-on:#ece3bd; --word:#ffd75e; --wordfg:#1d1d1f; --accent:#1d1d1f; --accentfg:#fff;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#161617; --fg:#ececec; --muted:#7d7d82; --line:#2a2a2d; --panel:#1d1d1f;
    --seg:#26262a; --seg-on:#3b3925; --word:#e0b83a; --wordfg:#111; --accent:#ececec; --accentfg:#161617; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{height:100dvh}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;
  max-width:760px;width:100%;margin:0 auto;padding:18px 20px 0}
h1{font-size:14px;font-weight:600;letter-spacing:.04em;margin:0;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:9px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
  padding:5px 16px;border-radius:7px;cursor:pointer}
.tab[aria-selected=true]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{flex:1;min-height:0;max-width:760px;width:100%;margin:0 auto;padding:16px 20px;display:flex;flex-direction:column}
#paste{flex:1;display:flex;flex-direction:column;min-height:0}
textarea{flex:1;width:100%;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  color:var(--fg);font:inherit;font-size:15px;line-height:1.75;padding:16px;outline:none}
textarea:focus{border-color:var(--muted)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:8px 2px 0}
.meta button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:0 0 0 14px}
.meta button:hover{color:var(--fg)}
#read{flex:1;overflow:auto;white-space:pre-wrap;font-size:16px;line-height:1.85;
  padding:18px 4px 40px;overflow-wrap:anywhere;tab-size:6}
.seg{cursor:pointer;border-radius:4px;transition:background .15s}
.seg:hover{background:var(--seg)}
.seg.on{background:var(--seg-on)}
mark{background:var(--word);color:var(--wordfg);border-radius:3px;padding:1px 0}
.empty{color:var(--muted);text-align:center;margin-top:20vh;white-space:normal}
[hidden]{display:none!important}
footer{border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.bar{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:14px;
  height:38px;min-width:38px;padding:0 12px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accentfg);border-color:var(--accent);min-width:88px;font-weight:600}
select{height:38px;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  font:inherit;font-size:14px;border-radius:10px;padding:0 10px;cursor:pointer;max-width:100%}
.spacer{flex:1}
.btn.pv{height:32px;font-size:13px;padding:0 10px;white-space:nowrap}
.voices label select{min-width:0;flex:1}
#pos{font-size:13px;color:var(--muted);min-width:70px;text-align:right}
details[open]{color:var(--fg)}
details{max-width:760px;margin:0 auto;padding:0 20px 12px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;width:max-content}
.voices{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
.voices label{display:flex;gap:6px;align-items:center;flex:1 1 280px}
body.pip{margin:0;padding:12px 14px;height:100vh;position:relative;overflow:hidden}
.pt{height:100%;overflow:auto;white-space:pre-wrap;line-height:1.65;font-size:20px;tab-size:6;overflow-wrap:anywhere}
.pn{display:none}
.pbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;opacity:0;transition:opacity .15s}
body.pip:hover .pbar{opacity:1}
.pbar .btn{height:34px;min-width:34px;padding:0 10px}
.pbar select{height:34px}
@media (max-width:520px){
  #pos{display:none}
  .bar{padding:10px 14px;gap:8px}
  .btn{min-width:36px;padding:0 10px}
  .btn.primary{min-width:76px}
  header,main{padding-left:14px;padding-right:14px}
}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.vcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;margin-top:10px}
.vact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#warn{color:#c0392b;font-size:13px;padding:6px 0 0}
</style>
</head>
<body>
<header>
  <h1>READ ALOUD</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-paste" aria-selected="true">Paste</button>
    <button class="tab" role="tab" id="tab-read" aria-selected="false">Read</button>
  </div>
</header>

<main>
  <section id="paste">
    <textarea id="input" spellcheck="false" placeholder="Paste Chinese or English text here…&#10;粘贴中文或英文文章…"></textarea>
    <div class="meta"><span id="count">0 characters</span>
      <span><button id="sample">Sample</button><button id="clear">Clear</button></span></div>
  </section>
  <section id="read" hidden></section>
  <div id="warn" hidden></div>
  <div class="vcard" id="vcard" hidden>
    <div id="vtext"></div>
    <pre id="vdump2" style="white-space:pre-wrap;font-size:12px;margin:8px 0 0"></pre>
    <div class="vact"><a class="btn" id="vopen" hidden>打开系统设置</a><button class="btn" id="vrecheck">重新检测</button></div>
  </div>
</main>

<footer>
  <div class="bar">
    <button class="btn primary" id="play">▶ Play</button>
    <button class="btn" id="stop" title="Stop">■</button>
    <button class="btn" id="prev" title="Previous sentence">‹</button>
    <button class="btn" id="next" title="Next sentence">›</button>
    <button class="btn" id="pop" title="Pop out a floating window">⧉</button>
    <span class="spacer"></span>
    <span id="pos"></span>
    <select id="speed" aria-label="Speed"></select>
  </div>
  <details open>
    <summary>Voices</summary>
    <div class="voices" id="tip" style="margin-bottom:6px"></div>
    <details id="vall"><summary>检测到的全部语音 / all detected voices</summary><pre id="vdump" style="white-space:pre-wrap;font-size:12px;margin:6px 0 0"></pre></details>
    <div class="voices">
      <label>中文 <select id="voice-zh"></select><button class="btn pv" data-mode="zh" title="试听">▶</button></label>
      <label>English <select id="voice-en"></select><button class="btn pv" data-mode="en" title="Preview">▶</button></label>
    </div>
  </details>
</footer>

<script src="reader.js"></script>
</body>
</html>
